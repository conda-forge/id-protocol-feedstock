schema_version: 1

context:
  version: "0.5.1"

package:
  name: id-protocol
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/i/id-protocol/id_protocol-${{ version }}.tar.gz
  sha256: 2193f147b5abfe2dc4e8e242531926124ab6bd6d0104934da44f0c7a6f31a9c3

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  python:
    entry_points:
      - idctl = idcli:main

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools >=68
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - idcli
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

  - requirements:
      run:
        - python ${{ python_min }}.*
    script:
      - idctl --help
      - idctl init --owner-id conda-test
      - idctl validate --owner-id conda-test
      - idctl refresh-soul --owner-id conda-test
      - idctl export-interop --owner-id conda-test
      - idctl export-compact --owner-id conda-test
      - idctl validate-compact --owner-id conda-test

about:
  summary: Portable human-AI context protocol reference tooling
  license: MIT
  license_file: LICENSE
  homepage: https://github.com/markoblogo/ID
  repository: https://github.com/markoblogo/ID

extra:
  recipe-maintainers:
    - markoblogo
